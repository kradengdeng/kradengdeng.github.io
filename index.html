<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F0">
<title>Badminton Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <button class="icon-btn" id="modeBtn" aria-label="Score counter"></button>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
</div>
<div id="splitView">
<div class="wrap">
  <div class="summary" id="summary"></div>
  <div class="section-head">
    <span class="section-title" id="courtsTitle"></span>
    <button class="btn primary sm" id="addCourtBtn"></button>
  </div>
  <div id="courtsList"></div>
  <div class="section-head">
    <span class="section-title" id="resultsTitle"></span>
  </div>
  <div id="results"></div>
</div>
</div>

<div id="counterView" class="counter-view" hidden></div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Settings" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="drawerTitle"></h2>
    <button class="icon-btn" id="closeDrawer" aria-label="Close"></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div class="overlay" id="confirmOverlay"></div>
<div class="confirm-modal" id="confirmModal" role="alertdialog" aria-modal="true">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle"></div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-actions">
      <button class="btn" id="confirmCancelBtn"></button>
      <button class="btn primary" id="confirmOkBtn"></button>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
