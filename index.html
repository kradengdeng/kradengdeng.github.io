<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Badminton Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F0; --surface:#FFFFFF; --surface-alt:#EFEDE5; --border:#DEDACC;
  --text:#20241F; --text-muted:#6B6F62; --text-faint:#93968A;
  --accent:#1F6D4C; --accent-strong:#175738; --accent-contrast:#FFFFFF; --accent-soft:#E3EFE7;
  --tier2:#B8792A; --tier2-soft:#F5E9D6;
  --tier3:#3E6E8E; --tier3-soft:#E2ECF2;
  --danger:#AE3C30; --danger-soft:#F5DFDB;
  --radius-sm:6px; --radius-md:10px;
  --shadow-1: 0 1px 2px rgba(20,20,10,0.06);
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#12160F; --surface:#1A1F19; --surface-alt:#212720; --border:#31382E;
  --text:#EEEEE6; --text-muted:#9BA091; --text-faint:#6E7267;
  --accent:#4FAE81; --accent-strong:#6EC79B; --accent-contrast:#0B140D; --accent-soft:#1D3226;
  --tier2:#D9A857; --tier2-soft:#392C16;
  --tier3:#7FA9C4; --tier3-soft:#1C2A33;
  --danger:#E08A7C; --danger-soft:#3A2420;
  --shadow-1: 0 1px 2px rgba(0,0,0,0.4);
  color-scheme: dark;
}
html[data-theme="minimal-dark"]{
  --bg:#090A0A; --surface:#111313; --surface-alt:#191B1B; --border:#292D2C;
  --text:#F3F5F4; --text-muted:#A7AEAB; --text-faint:#737B77;
  --accent:#DDE8E2; --accent-strong:#FFFFFF; --accent-contrast:#090A0A; --accent-soft:#26312C;
  --tier2:#D7B875; --tier2-soft:#342B1B;
  --tier3:#9DB2C9; --tier3-soft:#222B35;
  --danger:#F09A8E; --danger-soft:#452320;
  --shadow-1: 0 1px 2px rgba(0,0,0,0.55);
  color-scheme: dark;
}
html[data-theme="dark-blue"]{
  --bg:#0E1420; --surface:#141C2C; --surface-alt:#1B2537; --border:#2A3650;
  --text:#E9EDF6; --text-muted:#94A1BC; --text-faint:#647089;
  --accent:#5B96E0; --accent-strong:#82B2EC; --accent-contrast:#081018; --accent-soft:#1C2C46;
  --tier2:#D9A857; --tier2-soft:#332C18;
  --tier3:#8F86DC; --tier3-soft:#241F3C;
  --danger:#E08A7C; --danger-soft:#33201C;
  --shadow-1: 0 1px 2px rgba(0,0,0,0.45);
  color-scheme: dark;
}
html[data-theme="dark-purple"]{
  --bg:#170F20; --surface:#1F1629; --surface-alt:#271C34; --border:#3B2B4E;
  --text:#EFE9F6; --text-muted:#A697B8; --text-faint:#786A8E;
  --accent:#AC82E6; --accent-strong:#C4A3F0; --accent-contrast:#100916; --accent-soft:#2E2040;
  --tier2:#D9A857; --tier2-soft:#332715;
  --tier3:#6FA8C9; --tier3-soft:#1C2C38;
  --danger:#E08A7C; --danger-soft:#35201D;
  --shadow-1: 0 1px 2px rgba(0,0,0,0.45);
  color-scheme: dark;
}
html[data-theme="dark-red"]{
  --bg:#1D0D11; --surface:#281318; --surface-alt:#361A21; --border:#53303A;
  --text:#F6E9EC; --text-muted:#C19CA6; --text-faint:#8D6470;
  --accent:#D9687C; --accent-strong:#F08389; --accent-contrast:#2A070C; --accent-soft:#442029;
  --tier2:#E0B362; --tier2-soft:#3A2B1A;
  --tier3:#91A9CF; --tier3-soft:#232C43;
  --danger:#F09A8E; --danger-soft:#4A201E;
  --shadow-1: 0 1px 2px rgba(0,0,0,0.45);
  color-scheme: dark;
}
html[data-theme="dark-pink"]{
  --bg:#1D0F1A; --surface:#291423; --surface-alt:#371A2D; --border:#56334B;
  --text:#F7EAF4; --text-muted:#C4A5BB; --text-faint:#906F89;
  --accent:#E16BB0; --accent-strong:#F291C8; --accent-contrast:#2B0B20; --accent-soft:#49263E;
  --tier2:#E0B362; --tier2-soft:#3A2B1A;
  --tier3:#9AA9E0; --tier3-soft:#252B48;
  --danger:#F09A9A; --danger-soft:#4A2528;
  --shadow-1: 0 1px 2px rgba(0,0,0,0.45);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:64px;
}
.num, .money, input[type="text"].time-text{ font-family:'Space Grotesk',system-ui,sans-serif; font-variant-numeric: tabular-nums; }
button{font-family:inherit;}
.wrap{max-width:760px; margin:0 auto; padding:14px 16px 40px;}

/* topbar */
.topbar{display:flex; justify-content:flex-end; align-items:center; gap:8px; padding:10px 16px; max-width:760px; margin:0 auto;}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  flex:0 0 38px; width:38px; height:38px; padding:0; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  cursor:pointer; transition:background .15s ease, border-color .15s ease;
}
.topbar .icon-btn .ic{flex:0 0 18px; width:18px; height:18px;}
.icon-btn:hover{background:var(--surface-alt);}
.icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
svg.ic{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; display:block;}

/* summary */
.summary{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:12px 12px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow-1);
}
.stat .stat-top{display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:12.5px;}
.stat .stat-val{font-size:20px; font-weight:600; letter-spacing:-0.01em;}
.stat.total .stat-val{color:var(--accent-strong);}
html[data-theme="dark"] .stat.total .stat-val, html[data-theme="minimal-dark"] .stat.total .stat-val, html[data-theme="dark-blue"] .stat.total .stat-val, html[data-theme="dark-purple"] .stat.total .stat-val, html[data-theme="dark-red"] .stat.total .stat-val, html[data-theme="dark-pink"] .stat.total .stat-val{color:var(--accent);}

/* section headers */
.section-head{display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px;}
.section-title{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);}
.btn{
  display:inline-flex; align-items:center; gap:6px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:8px 12px; font-size:13.5px; font-weight:600; cursor:pointer;
  transition:background .15s ease;
}
.btn:hover{background:var(--surface-alt);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn.ghost{border-color:transparent; background:transparent;}
.btn.ghost:hover{background:var(--surface-alt);}
.btn.danger-txt{color:var(--danger);}
.btn.sm{padding:6px 9px; font-size:12.5px;}

/* court card */
.court{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow-1);}
.court-head{display:flex; align-items:center; gap:8px; padding:12px 12px 8px;}
.court-name{
  flex:1; border:none; background:transparent; font-size:16px; font-weight:600; color:var(--text);
  padding:4px 2px; border-bottom:1px solid transparent; min-width:0;
}
.court-name:hover, .court-name:focus{border-bottom-color:var(--border); outline:none;}
.court-actions{display:flex; gap:4px; flex-shrink:0;}

.court-time-row{display:flex; align-items:center; gap:8px; padding:0 12px 10px; flex-wrap:wrap;}
.time-field{position:relative; display:flex; align-items:center; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); overflow:hidden;}
.time-field input.time-text{
  width:64px; border:none; background:transparent; padding:7px 6px 7px 9px; font-size:16px; color:var(--text); text-align:center;
}
.time-field input.time-text.err{color:var(--danger);}
.time-field .pick-btn{border:none; background:var(--surface-alt); color:var(--text-muted); width:30px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-left:1px solid var(--border);}
.time-field input.time-native{position:absolute; inset:0; opacity:0; width:100%; height:100%; border:none; pointer-events:none;}
.time-sep{color:var(--text-faint); font-size:13px;}
.field-label{font-size:11.5px; color:var(--text-faint); margin-right:2px;}

.warn-banner{display:flex; gap:8px; align-items:flex-start; background:var(--tier2-soft); color:var(--tier2); border-top:1px solid var(--border); padding:8px 12px; font-size:12.5px; line-height:1.4;}
.warn-banner.err{background:var(--danger-soft); color:var(--danger);}
.warn-banner svg{flex-shrink:0; margin-top:1px;}

.players{border-top:1px solid var(--border);}
.player-row{display:flex; align-items:center; gap:6px; padding:8px 12px; border-bottom:1px solid var(--border);}
.player-row:last-of-type{border-bottom:none;}
.player-name{flex:1; min-width:0; border:1px solid transparent; background:transparent; padding:6px 6px; border-radius:var(--radius-sm); font-size:16px; color:var(--text);}
.player-name:hover, .player-name:focus{border-color:var(--border); outline:none; background:var(--surface);}
.player-row .time-field input.time-text{width:58px;}
.player-remove{flex-shrink:0; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; background:transparent; color:var(--text-faint); border-radius:var(--radius-sm); cursor:pointer;}
.player-remove:hover{background:var(--danger-soft); color:var(--danger);}
.add-player-row{padding:9px 12px;}

.empty-state{text-align:center; padding:34px 16px; color:var(--text-muted); font-size:14px; border:1px dashed var(--border); border-radius:var(--radius-md);}
.empty-state svg{margin-bottom:8px; opacity:.6;}

/* results */
.result-top{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; text-align:center; box-shadow:var(--shadow-1); margin-bottom:12px;}
.result-top .grand{font-size:34px; font-weight:700; letter-spacing:-0.02em; color:var(--accent-strong);}
html[data-theme="dark"] .result-top .grand, html[data-theme="minimal-dark"] .result-top .grand, html[data-theme="dark-blue"] .result-top .grand, html[data-theme="dark-purple"] .result-top .grand, html[data-theme="dark-red"] .result-top .grand, html[data-theme="dark-pink"] .result-top .grand{color:var(--accent);}
.result-top .grand-label{font-size:12.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px;}
.reconcile-note{font-size:12px; color:var(--tier2); margin-top:8px;}

table.people{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;}
table.people th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:9px 12px; border-bottom:1px solid var(--border); font-weight:600;}
table.people td{padding:10px 12px; border-bottom:1px solid var(--border); font-size:14.5px;}
table.people tr:last-child td{border-bottom:none;}
table.people td.amt{text-align:right; font-weight:600;}

.breakdown{margin-top:14px;}
.court-bd{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:10px; overflow:hidden;}
.court-bd-head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px; cursor:pointer;}
.court-bd-head .name{font-weight:600; font-size:14.5px; min-width:0; overflow-wrap:anywhere;}
.court-bd-head-actions{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.court-bd-head .total{color:var(--text-muted); font-size:13px;}
.copy-court{padding:5px 7px;}
.copy-court.copied{color:var(--accent); border-color:var(--accent);}
.court-bd-body{padding:0 12px 14px; border-top:1px solid var(--border);}
.court-payers{margin:12px 0 10px; padding:10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-alt);}
.court-payers-head{font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin-bottom:8px;}
.court-payer-list{display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:6px;}
.court-payer{display:flex; align-items:baseline; justify-content:space-between; gap:8px; min-width:0; padding:7px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface);}
.court-payer .name{min-width:0; overflow-wrap:anywhere; font-size:13px;}
.court-payer .pays-label{color:var(--text-muted); font-size:12px; margin-left:3px;}
.court-payer .amt{flex-shrink:0; font-weight:700; font-size:13.5px;}
.court-payers-empty{font-size:12.5px; color:var(--text-faint);}
.timeline{display:flex; height:26px; border-radius:6px; overflow:hidden; margin:12px 0 10px; border:1px solid var(--border);}
.tl-seg{position:relative; border-right:1px solid var(--surface); min-width:2px;}
.tl-seg:last-child{border-right:none;}
.tl-seg.tier-0{background:var(--accent-soft);}
.tl-seg.tier-1{background:var(--tier2-soft);}
.tl-seg.tier-2{background:var(--tier3-soft);}
.tl-seg.empty{background:repeating-linear-gradient(135deg, var(--danger-soft), var(--danger-soft) 4px, transparent 4px, transparent 8px);}
.payer-seg-list{display:flex; flex-direction:column; gap:6px;}
.payer-seg-item{padding:8px; border-radius:6px; background:var(--surface-alt);}
.payer-seg-meta{font-size:12.5px; color:var(--text-muted); font-family:'Space Grotesk',system-ui,sans-serif; font-variant-numeric:tabular-nums;}
.payer-seg-names{margin-top:3px; color:var(--text); font-size:13px; overflow-wrap:anywhere;}

/* settings drawer */
.overlay{position:fixed; inset:0; background:rgba(10,12,8,.4); opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:40;}
.overlay.open{opacity:1; pointer-events:auto;}
.drawer{
  position:fixed; top:0; right:0; height:100%; width:380px; max-width:92vw; background:var(--surface);
  border-left:1px solid var(--border); transform:translateX(100%); transition:transform .22s ease;
  z-index:41; display:flex; flex-direction:column;
}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border);}
.drawer-head h2{font-size:15px; margin:0; font-weight:600;}
.drawer-body{overflow-y:auto; padding:6px 16px 24px; flex:1;}
.set-group{margin-top:16px;}
.set-group-title{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin:0 0 8px; padding-top:14px; border-top:1px solid var(--border);}
.set-group:first-child .set-group-title{border-top:none; padding-top:0;}
.set-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:10px 0;}
.set-row .set-label{display:flex; flex-direction:column; gap:2px;}
.set-row .set-title{font-size:14px; font-weight:600;}
.set-row .set-desc{font-size:12px; color:var(--text-muted);}
.set-row .set-control{flex-shrink:0; padding-top:2px;}
select.dd{
  border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:var(--radius-sm);
  padding:7px 8px; font-size:16px; font-family:inherit;
}
.segctl{display:flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden;}
.segctl button{border:none; background:var(--surface); color:var(--text-muted); padding:6px 10px; font-size:12.5px; font-weight:600; cursor:pointer;}
.segctl button.active{background:var(--accent); color:var(--accent-contrast);}
.switch{position:relative; width:40px; height:24px; display:inline-block;}
.switch input{opacity:0; width:0; height:0; position:absolute;}
.slider{position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer; transition:background .15s ease;}
.slider::before{content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:var(--surface); border-radius:50%; transition:transform .15s ease; box-shadow:0 1px 2px rgba(0,0,0,.25);}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(16px);}

.rule-row{display:flex; align-items:center; gap:6px; padding:6px 0;}
.rule-row .time-field input.time-text{width:56px;}
.rule-row .price-input{width:64px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); padding:6px 6px; font-size:16px; text-align:right;}
.rule-row .rule-del{width:26px; height:26px; border:none; background:transparent; color:var(--text-faint); border-radius:var(--radius-sm); cursor:pointer; flex-shrink:0;}
.rule-row .rule-del:hover{background:var(--danger-soft); color:var(--danger);}
.pricing-help{font-size:11.5px; color:var(--text-faint); margin:2px 0 8px; line-height:1.5;}

.danger-zone .btn{width:100%; justify-content:center; margin-top:8px;}
.credit{text-align:center; font-size:11.5px; color:var(--text-faint); margin-top:22px; padding-top:14px; border-top:1px solid var(--border);}


/* score counter */
.counter-view{max-width:980px; margin:0 auto; padding:clamp(18px,4vw,48px) 16px 48px;}
.scoreboard{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:stretch; gap:clamp(12px,3vw,34px); min-height:min(72vh,620px);}
.score-side{display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:0; padding:clamp(16px,4vw,42px) clamp(10px,3vw,30px); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-1);}
.score-name{width:100%; max-width:360px; border:1px solid transparent; border-bottom-color:var(--border); background:transparent; color:var(--text); text-align:center; font-size:clamp(18px,3vw,26px); font-weight:600; padding:8px 6px; outline:none;}
.score-name:focus{border-color:var(--accent); border-radius:var(--radius-sm);}
.score-value{display:block; width:100%; border:1px solid transparent; background:transparent; color:var(--accent-strong); font-family:'Space Grotesk',system-ui,sans-serif; font-variant-numeric:tabular-nums; font-size:clamp(72px,18vw,180px); line-height:1; letter-spacing:-.06em; font-weight:700; margin:clamp(20px,6vw,56px) 0; overflow-wrap:anywhere; text-align:center; outline:none; -moz-appearance:textfield;}
.score-value::-webkit-outer-spin-button,.score-value::-webkit-inner-spin-button{margin:0; -webkit-appearance:none;}
.score-value:focus{border-color:var(--accent); border-radius:var(--radius-sm);}
html[data-theme="dark"] .score-value, html[data-theme="minimal-dark"] .score-value{color:var(--accent);}
.score-actions{display:flex; gap:10px; width:100%; max-width:360px;}
.score-actions .btn{flex:1; justify-content:center; min-height:52px; font-size:28px; line-height:1;}
.score-actions .btn:active{transform:translateY(1px);}
.score-divider{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--text-faint); font-family:'Space Grotesk',system-ui,sans-serif; font-size:20px; font-weight:600;}
.score-divider::before,.score-divider::after{content:""; width:1px; flex:1; background:var(--border);}
.score-reset{display:flex; justify-content:center; margin-top:18px;}
.counter-portrait{display:none; text-align:center; color:var(--text-muted); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:34px 22px; box-shadow:var(--shadow-1);}
.counter-portrait .portrait-icon{font-size:38px; color:var(--accent); margin-bottom:10px;}
.counter-portrait strong{display:block; color:var(--text); font-size:17px; margin-bottom:5px;}
.counter-portrait span{font-size:13px;}
@media (max-width:700px) and (orientation:portrait){
  .counter-view{padding-top:18px;}
  .scoreboard,.score-reset{display:none;}
  .counter-portrait{display:block;}
}
@media (max-width:560px) and (orientation:landscape){
  .counter-view{padding:10px 12px 20px;}
  .scoreboard{min-height:calc(100vh - 78px); gap:8px;}
  .score-side{padding:10px 8px;}
  .score-value{margin:12px 0 18px; font-size:clamp(58px,17vw,120px);}
  .score-actions .btn{min-height:42px; font-size:24px;}
  .score-reset{margin-top:8px;}
}

/* confirm modal */
#confirmOverlay{z-index:50;}
.confirm-modal{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:51; padding:20px; opacity:0; pointer-events:none; transition:opacity .15s ease;}
.confirm-modal.open{opacity:1; pointer-events:auto;}

};
function t(key, ...args){
  const v = STR[state.settings.language][key];
  return typeof v==='function' ? v(...args) : v;
}

/* ---------- time helpers ---------- */
function parseTimeStr(str){
  if(str==null) return null;
  let s = String(str).trim().toLowerCase();
  if(!s) return null;
  let ap = null;
  const m = s.match(/(a\.?m\.?|p\.?m\.?)$/);
  if(m){ ap = m[1][0]; s = s.slice(0, m.index).trim(); }
  s = s.replace(/\s+/g,'');
  let h=null, mm=0;
  if(/^\d{1,2}[:.\-]\d{1,2}$/.test(s)){
    const parts = s.split(/[:.\-]/);
    h = parseInt(parts[0],10); mm = parseInt(parts[1],10);
  } else if(/^\d{3,4}$/.test(s)){
    if(s.length===3){ h = parseInt(s.slice(0,1),10); mm = parseInt(s.slice(1),10); }
    else { h = parseInt(s.slice(0,2),10); mm = parseInt(s.slice(2),10); }
  } else if(/^\d{1,2}$/.test(s)){
    h = parseInt(s,10); mm = 0;
  } else return null;
  if(isNaN(h)||isNaN(mm)) return null;
  if(ap){
    if(h<1||h>12) return null;
    if(ap==='p' && h!==12) h+=12;
    if(ap==='a' && h===12) h=0;
  }
  if(h<0||h>23||mm<0||mm>59) return null;
  return h*60+mm;
}
function pad2(n){ return n<10?'0'+n:''+n; }
function fmtTime(mins, fmt){
  fmt = fmt || state.settings.timeFormat;
  mins = ((mins%1440)+1440)%1440;
  const h = Math.floor(mins/60), m = mins%60;
  if(fmt===24) return pad2(h)+':'+pad2(m);
  let hh = h%12; if(hh===0) hh=12;
  const period = h<12?'AM':'PM';
  return hh+':'+pad2(m)+' '+period;
}
function nativeTimeVal(mins){ const h=Math.floor(mins/60), m=mins%60; return pad2(h)+':'+pad2(m); }

/* ---------- money ---------- */
function fmtMoney(amount){
  const a = Number.isFinite(Number(amount)) ? Number(amount) : 0;
  return '\u0E3F' + a.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* ---------- state ---------- */
const STORE_KEY = 'badmintonSplit.v1';
let idc = 1;
function uid(){ return 'id'+(idc++)+Math.random().toString(36).slice(2,7); }

function defaultState(){
  return {
    activeMode:'split',
    scoreCounter:{leftName:'', rightName:'', leftScore:0, rightScore:0},
    settings:{
      language:'th', theme:'white', timeFormat:24, autoSave:true,
      pricingRules:[ {id:uid(), start:660, price:120}, {id:uid(), start:960, price:160} ]
    },
    courts:[]
  };
}
let state = loadState();
let expanded = new Set();

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.settings || !parsed.courts) return defaultState();
    let migrated = false;
    if(!['split','counter'].includes(parsed.activeMode)){ parsed.activeMode = 'split'; migrated = true; }
    if(!parsed.scoreCounter || typeof parsed.scoreCounter !== 'object'){ parsed.scoreCounter = {leftName:'', rightName:'', leftScore:0, rightScore:0}; migrated = true; }
    const sc = parsed.scoreCounter;
    if(typeof sc.leftName !== 'string'){ sc.leftName = ''; migrated = true; }
    if(typeof sc.rightName !== 'string'){ sc.rightName = ''; migrated = true; }
    ['leftScore','rightScore'].forEach(k=>{ const n = Number(sc[k]); if(!Number.isFinite(n)){ sc[k] = 0; migrated = true; } else if(sc[k] !== n){ sc[k] = n; migrated = true; } });
    if(typeof parsed.settings.autoSave!=='boolean'){ parsed.settings.autoSave = true; migrated = true; }
    if(Object.prototype.hasOwnProperty.call(parsed.settings, 'accuratePrice')){ delete parsed.settings.accuratePrice; migrated = true; }
    if(!['white','dark','minimal-dark'].includes(parsed.settings.theme)){
      parsed.settings.theme = parsed.settings.theme==='system' ? 'white' : 'dark';
      migrated = true;
    }
    if(migrated) localStorage.setItem(STORE_KEY, JSON.stringify(parsed));
    return parsed;
  }catch(e){ return defaultState(); }
}
let saveTimer = null;
function persist(force=false){
  if(!force && state.settings.autoSave===false) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }, 150);
}

/* ---------- theme ---------- */
function applyTheme(){
  const mode = state.settings.theme;
  let resolved = mode;
  if(mode==='white') resolved = 'light';
  else if(mode==='system') resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', resolved);
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(state.settings.theme==='system') applyTheme(); });

/* ---------- calculation engine ---------- */
function sortedRules(){
  return [...state.settings.pricingRules].sort((a,b)=>a.start-b.start);
}
function rateAt(minute, rules){
  let applicable = null;
  for(const r of rules){ if(r.start<=minute) applicable = r; else break; }
  return applicable;
}
function computeCourt(court){
  const warnings = [];
  const result = { id:court.id, name:court.name, start:court.start, end:court.end, total:0, allocated:0, unassigned:0, segments:[], playerTotals:{}, payerIntervals:[], invalid:false };
  if(court.end<=court.start){
    result.invalid = true;
    warnings.push({type:'err', msg:t('endBeforeStart')});
    result.warnings = warnings;
    return result;
  }
  const rules = sortedRules();
  const seenNames = new Set(); const dupNames = new Set();
  const activePlayers = [];
  for(const p of court.players){
    const nameTrim = (p.name||'').trim();
    if(!nameTrim){ warnings.push({type:'warn', msg:t('emptyName'), playerId:p.id}); continue; }
    if(p.end<=p.start){ warnings.push({type:'warn', msg:t('endBeforeStart'), playerId:p.id}); continue; }
    const cs = Math.max(p.start, court.start), ce = Math.min(p.end, court.end);
    if(ce<=cs){ warnings.push({type:'warn', msg:t('outsideBooking'), playerId:p.id}); continue; }
    if(cs>p.start || ce<p.end){ /* clamped silently, informative only */ }
    const key = nameTrim.toLowerCase();
    if(seenNames.has(key)) dupNames.add(nameTrim); else seenNames.add(key);
    activePlayers.push({ id:p.id, name:nameTrim, start:cs, end:ce });
  }
  dupNames.forEach(n=> warnings.push({type:'warn', msg:t('duplicateName', n)}) );

  const breakpoints = new Set([court.start, court.end]);
  rules.forEach(r=>{ if(r.start>court.start && r.start<court.end) breakpoints.add(r.start); });
  activePlayers.forEach(p=>{ breakpoints.add(p.start); breakpoints.add(p.end); });
  const pts = [...breakpoints].sort((a,b)=>a-b);

  for(let i=0;i<pts.length-1;i++){
    const segStart = pts[i], segEnd = pts[i+1];
    if(segEnd<=segStart) continue;
    const durMin = segEnd-segStart;
    const rate = rateAt(segStart, rules);
    const active = activePlayers.filter(p=> p.start<=segStart && p.end>=segEnd );
    let cost = 0, priced = true;
    if(!rate){ priced = false; warnings.push({type:'warn', msg:t('noPriceWarn', fmtTime(segStart)+'\u2013'+fmtTime(segEnd))}); }
    else cost = rate.price * (durMin/60);
    result.total += cost;
    if(active.length===0){
      if(priced && cost>0) warnings.push({type:'warn', msg:t('unassignedWarn', fmtTime(segStart)+'\u2013'+fmtTime(segEnd), durMin)});
      result.unassigned += cost;
    } else {
      const share = cost/active.length;
      active.forEach(p=>{ result.playerTotals[p.name] = (result.playerTotals[p.name]||0) + share; });
      result.allocated += cost;
    }
    result.segments.push({ start:segStart, end:segEnd, rate: rate?rate.price:null, players: active.map(p=>p.name), share: active.length? cost/active.length : 0, cost, priced });
  }
  result.payerIntervals = buildPayerIntervals(activePlayers, result.playerTotals, rules);
  result.warnings = warnings;
  return result;
}

function intervalRateText(start, end, rules){
  const points = [start, end, ...rules.filter(r=>r.start>start && r.start<end).map(r=>r.start)].sort((a,b)=>a-b);
  const prices = [];
  for(let i=0;i<points.length-1;i++){
    const rate = rateAt(points[i], rules);
    const value = rate ? rate.price : null;
    if(!prices.includes(value)) prices.push(value);
  }
  if(prices.length===1 && prices[0]!==null) return '฿'+prices[0]+'/hr';
  return prices.length>1 ? t('mixedRates') : t('invalidTime');
}
function buildPayerIntervals(activePlayers, playerTotals, rules){
  const byInterval = new Map();
  activePlayers.forEach(p=>{
    const key = p.start+'|'+p.end;
    if(!byInterval.has(key)) byInterval.set(key, {start:p.start, end:p.end, names:[]});
    const group = byInterval.get(key);
    if(!group.names.some(n=>n.toLowerCase()===p.name.toLowerCase())) group.names.push(p.name);
  });
  return [...byInterval.values()]
    .map(group=>({...group, amount:group.names.length ? playerTotals[group.names[0]]||0 : 0, rateText:intervalRateText(group.start, group.end, rules)}))
    .sort((a,b)=>a.start-b.start || b.end-a.end || a.names[0].localeCompare(b.names[0]));
}

function compactAmount(amount){
  return Number(amount||0).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
}
function compactTime(minutes){
  return fmtTime(minutes, 24).replace(':','.');
}
function compactCourtText(courtResult){
  const lines = [`- ${courtResult.name}: ${compactTime(courtResult.start)}-${compactTime(courtResult.end)}`];
  const payers = Object.entries(courtResult.playerTotals);
  payers.forEach(([name, amount])=>lines.push(`${name}: ${compactAmount(amount)} ${t('baht')}`));
  lines.push('', `  ${t('grandTotalCompact')} ${compactAmount(courtResult.total)} ${t('baht')}`);
  return lines.join('\n');
}
async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    await navigator.clipboard.writeText(text);
    return;
  }
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly','');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  const copied = document.execCommand('copy');
  area.remove();
  if(!copied) throw new Error('copy failed');
}

function computeAll(){
  const courtsResult = state.courts.map(computeCourt);
  const perPerson = {};
  let grandTotal = 0, grandAllocated = 0;
  const uniquePlayers = new Set();
  courtsResult.forEach(cr=>{
    if(cr.invalid) return;
    grandTotal += cr.total;
    grandAllocated += cr.allocated;
    Object.keys(cr.playerTotals).forEach(name=>{
      uniquePlayers.add(name);
      perPerson[name] = (perPerson[name]||0) + cr.playerTotals[name];
    });
  });
  return { courtsResult, perPerson, grandTotal, grandAllocated, playersCount: uniquePlayers.size, courtsCount: state.courts.length };
}

function bindCourtEvents(){
  document.querySelectorAll('.court').forEach(el=>{
    const courtId = el.getAttribute('data-court');
    const court = findCourt(courtId);

    el.querySelector('[data-role="court-name"]').addEventListener('input', e=>{
      court.name = e.target.value; persist(); renderResults();
    });
    el.querySelector('[data-role="dup-court"]').addEventListener('click', ()=>{
      const copy = JSON.parse(JSON.stringify(court));
      copy.id = uid(); copy.name = court.name + t('copySuffix');
      copy.players = copy.players.map(p=>({...p, id:uid()}));
      const idx = state.courts.indexOf(court);
      state.courts.splice(idx+1,0,copy);
      persist(); renderCourts(); renderResults();
    });
    el.querySelector('[data-role="del-court"]').addEventListener('click', ()=>{
      state.courts = state.courts.filter(c=>c.id!==courtId);
      persist(); renderCourts(); renderResults();
    });
    bindTimeField(el.querySelector('[data-role="court-start"]'), court.start, m=>{ court.start=m; persist(); renderResults(); });
    bindTimeField(el.querySelector('[data-role="court-end"]'), court.end, m=>{ court.end=m; persist(); renderResults(); });

    el.querySelector('[data-role="add-player"]').addEventListener('click', ()=>{
      court.players.push({ id:uid(), name:'', start:court.start, end:court.end });
      persist(); renderCourts(); renderResults();
    });
    el.querySelectorAll('.player-row').forEach(prow=>{
      const pid = prow.getAttribute('data-player');
      const player = findPlayer(court, pid);
      prow.querySelector('[data-role="player-name"]').addEventListener('input', e=>{
        player.name = e.target.value; persist(); renderResults();
      });
      prow.querySelector('[data-role="del-player"]').addEventListener('click', ()=>{
        court.players = court.players.filter(p=>p.id!==pid);
        persist(); renderCourts(); renderResults();
      });
      bindTimeField(prow.querySelector('[data-role="player-start"]'), player.start, m=>{ player.start=m; persist(); renderResults(); });
      bindTimeField(prow.querySelector('[data-role="player-end"]'), player.end, m=>{ player.end=m; persist(); renderResults(); });
    });
  });
}

function bindTimeField(fieldEl, currentMinutes, onCommit){
  const textInp = fieldEl.querySelector('[data-part="text"]');
  const nativeInp = fieldEl.querySelector('[data-part="native"]');
  const pickBtn = fieldEl.querySelector('[data-part="pickbtn"]');
  function commit(minutes){
    textInp.classList.remove('err');
    textInp.value = fmtTime(minutes);
    nativeInp.value = nativeTimeVal(minutes);
    onCommit(minutes);
  }
  textInp.addEventListener('change', ()=>{
    const parsed = parseTimeStr(textInp.value);
    if(parsed==null){ textInp.classList.add('err'); textInp.value = fmtTime(currentMinutes); return; }
    commit(parsed);
  });
  textInp.addEventListener('keydown', e=>{ if(e.key==='Enter') textInp.blur(); });
  pickBtn.addEventListener('click', ()=>{
    if(typeof nativeInp.showPicker==='function'){ try{ nativeInp.showPicker(); }catch(e){ nativeInp.focus(); } }
    else nativeInp.focus();
  });
  nativeInp.addEventListener('change', ()=>{
    const [h,m] = nativeInp.value.split(':').map(Number);
    if(!isNaN(h)) commit(h*60+(m||0));
  });
}

    });
    row.querySelector('[data-role="del-rule"]').addEventListener('click', ()=>{
      state.settings.pricingRules = state.settings.pricingRules.filter(r=>r.id!==id);
      persist(); renderDrawer(); renderResults();
    });
  });
}

/* ---------- init ---------- */
function addCourt(){
  const n = state.courts.length+1;
  state.courts.push({ id:uid(), name:t('courtNameDefault', n), start:1080, end:1140, players:[] });
  persist(); renderCourts(); renderResults();
}

$('#addCourtBtn').addEventListener('click', addCourt);
$('#modeBtn').addEventListener('click', ()=>{ state.activeMode = state.activeMode==='counter' ? 'split' : 'counter'; persist(); renderAll(); });
$('#settingsBtn').addEventListener('click', openDrawer);
$('#closeDrawer').addEventListener('click', closeDrawerFn);
$('#overlay').addEventListener('click', closeDrawerFn);

applyTheme();
renderAll();
})();
</script>
</body>
</html>
